server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Assets com hash podem ter cache longo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html nunca pode ficar preso no cache do navegador, senão o usuário
  # continua com o bundle antigo depois de um redeploy (os assets têm hash,
  # mas o index é quem aponta para eles)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA: todas as rotas do React Router voltam para o index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
